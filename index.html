<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safar Saathi">
<meta name="theme-color" content="#F2F4F9">
<title>Safar Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg-body:#F2F4F9;--bg-card:#FFFFFF;--text-main:#1C2026;--text-muted:#5B6471;--text-light:#8A94A6;--border-light:#E2E8F0;--accent-green:#10B981;--accent-red:#EF4444;--accent-orange:#F59E0B;--accent-blue:#2563EB;
--c-current-1:#17905F;--c-current-2:#0A4A33;--c-current-bg:#E8F5EE;--sab:env(safe-area-inset-bottom,20px);--sat:env(safe-area-inset-top,44px);--tab-height:calc(64px + var(--sab));}
@media (prefers-color-scheme: dark){:root{--bg-body:#0E1118;--bg-card:#181D27;--text-main:#F1F5F9;--text-muted:#94A3B8;--border-light:#334155;--accent-blue:#60A5FA;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Bricolage Grotesque',-apple-system,sans-serif;background:var(--bg-body);color:var(--text-main);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;border:none;outline:none;}
button{cursor:pointer;}
#app-container{max-width:560px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg-body);}
.text-xl{font-size:1.25rem;font-weight:700;}.text-lg{font-size:1.125rem;font-weight:600;}.text-2xl{font-size:1.5rem;font-weight:700;}.text-sm{font-size:.875rem;}.text-xs{font-size:.75rem;}
.font-bold{font-weight:700;}.text-muted{color:var(--text-muted);}.text-center{text-align:center;}
.flex{display:flex;}.flex-col{display:flex;flex-direction:column;}.flex-1{flex:1;min-width:0;}.items-center{align-items:center;}.items-start{align-items:flex-start;}.justify-between{justify-content:space-between;}
.gap-2{gap:.5rem;}.gap-3{gap:.75rem;}.gap-4{gap:1rem;}.p-4{padding:1rem;}.mb-2{margin-bottom:.5rem;}.mb-4{margin-bottom:1rem;}.mb-6{margin-bottom:1.5rem;}.mb-8{margin-bottom:2rem;}.mt-4{margin-top:1rem;}
.rounded-2xl{border-radius:1.5rem;}.rounded-xl{border-radius:1rem;}.z-10{z-index:10;}.hidden{display:none!important;}
.header{padding:calc(1rem + var(--sat)) 1rem 1rem;position:sticky;top:0;z-index:40;background:var(--bg-body);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tab-content{display:none;padding-bottom:calc(var(--tab-height) + 2rem);}
.tab-content.active{display:block;animation:fadeIn .3s ease;}
.tab-bar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;height:var(--tab-height);background:var(--bg-card);border-top:1px solid var(--border-light);display:flex;padding-bottom:var(--sab);z-index:50;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;color:var(--text-muted);font-size:.66rem;font-weight:600;gap:3px;transition:.2s;}
.tab-btn .emoji{font-size:1.15rem;filter:grayscale(1);opacity:.7;transition:.2s;}
.tab-btn.active{color:var(--c-current-1);}.tab-btn.active .emoji{filter:none;opacity:1;transform:scale(1.12);}
.hero-card{background:linear-gradient(135deg,var(--c-current-1),var(--c-current-2));color:#fff;padding:1.5rem;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:200px;justify-content:space-between;}
.hero-bg-svg{position:absolute;bottom:-5px;right:-5px;width:150%;height:120px;opacity:.2;pointer-events:none;}
.status-chip{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:600;display:inline-flex;gap:8px;align-items:center;}
.pulse-dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:pulse 1.5s infinite;}
.route-bar{display:flex;align-items:center;gap:4px;margin-top:1rem;overflow-x:auto;padding-bottom:4px;}
.route-node{font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.12);white-space:nowrap;opacity:.7;}
.route-node.active{background:#fff;color:var(--c-current-2);opacity:1;}
.boarding-pass{background:var(--bg-card);border-radius:1.5rem;filter:drop-shadow(0 10px 15px rgba(0,0,0,.08));margin-top:-2rem;position:relative;z-index:5;}
.bp-top{padding:1.5rem;display:flex;flex-direction:column;gap:12px;}
.bp-bottom{padding:1.2rem 1.5rem;background:rgba(0,0,0,.02);border-radius:0 0 1.5rem 1.5rem;}
.bp-divider{height:20px;position:relative;background-image:linear-gradient(to right,var(--border-light) 50%,transparent 50%);background-size:16px 1px;background-repeat:repeat-x;background-position:center;}
.bp-divider::before,.bp-divider::after{content:'';position:absolute;top:0;width:20px;height:20px;background:var(--bg-body);border-radius:50%;}
.bp-divider::before{left:-10px;}.bp-divider::after{right:-10px;}
.emoji-tile{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--c-current-bg);}
.doc-chip{padding:6px 10px;border-radius:20px;font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border-light);}
.doc-chip.ok{border-color:var(--accent-green);color:var(--accent-green);background:rgba(16,185,129,.1);}
.doc-chip.miss{border-color:var(--accent-red);color:var(--accent-red);background:rgba(239,68,68,.08);}
.banner-warning{background:var(--accent-orange);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:1.5rem;}
.btn-primary{background:var(--c-current-1);color:#fff;padding:14px 22px;border-radius:12px;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:.1s;}
.btn-primary:active{transform:scale(.97);}.btn-primary:disabled{opacity:.45;pointer-events:none;}
.btn-primary.big{padding:16px;}
.btn-secondary{background:var(--bg-body);color:var(--text-main);border:1px solid var(--border-light);padding:12px 18px;border-radius:12px;font-size:.9rem;font-weight:600;width:100%;text-align:center;}
.btn-outline{border:2px dashed var(--border-light);color:var(--text-muted);background:transparent;padding:13px;border-radius:12px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-card);font-size:1.1rem;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.btn-round{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-light);background:var(--bg-body);color:var(--text-main);font-weight:700;flex-shrink:0;}
.pill{border:1px solid var(--border-light);background:var(--bg-body);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--text-main);white-space:nowrap;}
.pill.ok{color:var(--accent-green);border-color:var(--accent-green);}
.pill.bad{color:var(--accent-red);border-color:var(--accent-red);}
.who{color:var(--accent-blue);font-weight:700;}
.text-ok{color:var(--accent-green);}.text-bad{color:var(--accent-red);}
.sec-title{font-weight:800;font-size:13px;color:var(--text-muted);text-transform:uppercase;margin:18px 4px 8px;letter-spacing:.03em;}
.card{background:var(--bg-card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.det{border-bottom:1px solid var(--border-light);}
.det summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:700;font-size:14px;gap:8px;}
.det summary::-webkit-details-marker{display:none;}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-light);}
.ck:last-child{border-bottom:none;}
.checkbox-round{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-light);display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0;}
.check-item.done .checkbox-round{background:var(--accent-green);border-color:var(--accent-green);color:#fff;}
.check-item.done .check-text{text-decoration:line-through;color:var(--text-muted);}
.check-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-light);}
.check-item:last-child{border-bottom:none;}
.tl-item{display:flex;gap:12px;align-items:center;background:var(--bg-card);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.tl-item.done{opacity:.65;}
.tl-em{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.stamps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.stamp-wrapper{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px dashed var(--border-light);border-radius:50%;}
.stamp-svg{width:100%;height:100%;position:absolute;top:0;left:0;filter:grayscale(1);opacity:.3;transition:.3s;}
.stamp-svg.collected{filter:none;opacity:1;}
.stamp-emoji{font-size:1.5rem;position:relative;z-index:2;}
.chipbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
.chipbar button{white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-main);font-size:12px;font-weight:700;}
.chipbar button.on{background:var(--c-current-1);color:#fff;border-color:transparent;}
.seg{display:flex;background:var(--bg-card);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.seg button{flex:1;padding:9px 4px;border-radius:9px;background:none;color:var(--text-muted);font-weight:700;font-size:13px;}
.seg button.on{background:var(--c-current-1);color:#fff;}
.total-card{background:linear-gradient(135deg,#2563EB,#4338CA);color:#fff;padding:20px;border-radius:1.5rem;margin-bottom:14px;box-shadow:0 8px 20px rgba(37,99,235,.25);}
.total-card .muted{color:rgba(255,255,255,.8);}
.led-grp{font-size:12px;font-weight:700;color:var(--text-muted);margin:12px 0 4px;}
.led-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border-light);cursor:pointer;font-size:14px;}
.led-row:last-child{border-bottom:none;}
.day-card{background:var(--bg-card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.thumb-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.thumb-g img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;}
.lbl2{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin:10px 0 2px;}
.wwho{font-size:15px;margin:8px 0;}
.wwho .who{font-size:22px;display:block;margin-top:2px;}
.mini-in{width:120px;padding:7px;border-radius:8px;border:1px solid var(--border-light);background:var(--bg-body);color:var(--text-main);font-size:13px;}
.bottom-sheet input,.bottom-sheet select,.card input,.card select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border-light);background:var(--bg-body);color:var(--text-main);font-size:16px;margin:6px 0;}
.inrow{display:flex;gap:8px;align-items:center;}
.inrow>*{flex:1;min-width:0;margin:6px 0!important;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:100;display:none;}
.overlay.active{display:block;}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--bg-card);border-radius:1.5rem 1.5rem 0 0;padding:1.4rem 1.4rem calc(1.4rem + var(--sab));z-index:101;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto;box-shadow:0 -10px 25px rgba(0,0,0,.2);}
.bottom-sheet.active{transform:translateY(0);}
.sheet-handle{width:40px;height:5px;background:var(--border-light);border-radius:3px;margin:0 auto 1rem;}
.bottom-sheet h3{font-size:1.2rem;font-weight:800;margin-bottom:10px;}
#celebration-overlay{position:fixed;inset:0;background:rgba(14,17,24,.92);z-index:999;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;display:none;}
#celebration-overlay.active{display:flex;}
#confetti-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.big-stamp{width:200px;height:200px;margin-bottom:2rem;animation:thump .5s cubic-bezier(.175,.885,.32,1.275) forwards;}
.big-stamp svg{width:100%;height:100%;}
.banner-stamp{position:fixed;top:calc(var(--sat) + 10px);left:50%;transform:translateX(-50%);background:#16A34A;color:#fff;padding:10px 18px;border-radius:20px;font-weight:700;z-index:200;box-shadow:0 6px 16px rgba(0,0,0,.2);animation:fadeIn .3s ease;max-width:90%;text-align:center;}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:30px;z-index:9999;font-weight:700;font-size:14px;max-width:90%;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.show{opacity:1;}
.wiz-center{text-align:center;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:.5;}100%{transform:scale(1);opacity:1;}}
@keyframes thump{to{transform:scale(1) rotate(-10deg);opacity:1;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="app-container">
  <header class="header">
    <div>
      <h1 class="text-xl" id="greeting">Safar Saathi</h1>
      <p class="text-sm text-muted">14–29 Nov 2026 • 6 <span>Afraad</span></p>
    </div>
    <div class="flex gap-2">
      <button class="btn-icon" data-act="lang" id="langBtn">EN</button>
      <button class="btn-icon" data-act="weather" id="wbtn">--°</button>
      <button class="btn-icon" data-act="settings">⚙️</button>
    </div>
  </header>

  <!-- AB (NOW) -->
  <main id="tab-ab" class="tab-content active p-4"><div id="ab-area"></div></main>

  <!-- SAFAR (STAMPS + TIMELINE) -->
  <main id="tab-safar" class="tab-content p-4">
    <div class="card" style="padding:20px">
      <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">Passport Book 📕</h2><div class="text-sm font-bold text-muted" id="stamp-count">0/0</div></div>
      <div class="stamps-grid" id="stamps"></div>
    </div>
    <div class="btnrow-2 flex gap-2 mb-4"><button class="btn-secondary flex-1" data-act="actAdd">➕ Nayi jagah / kaam</button></div>
    <h2 class="text-lg font-bold mb-4">Safar ki Tafseel</h2>
    <div id="timeline"></div>
  </main>

  <!-- KAGHZAAT -->
  <main id="tab-kaghzaat" class="tab-content p-4">
    <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">Safar ke Kaghzaat 🛂</h2></div>
    <div class="flex gap-2 mb-4"><button class="btn-primary flex-1" data-act="wizOpen">Ek ek kar ke dein</button></div>
    <div id="kaghzaat"></div>
  </main>

  <!-- LISTS -->
  <main id="tab-lists" class="tab-content p-4">
    <div class="seg">
      <button class="on" data-act="listTab" data-v="packing" id="lt-packing">Packing</button>
      <button data-act="listTab" data-v="shopping" id="lt-shopping">Shopping</button>
      <button data-act="listTab" data-v="pending" id="lt-pending">Pending</button>
    </div>
    <div id="lists-area"></div>
  </main>

  <!-- KHARCHA -->
  <main id="tab-kharcha" class="tab-content p-4">
    <h2 class="text-xl font-bold mb-4">Kharcha Ledger 💰</h2>
    <div id="kh-top"></div>
    <button class="btn-primary mb-4" data-act="expNew">➕ Naya kharcha</button>
    <div class="chipbar" id="kh-cats"></div>
    <div class="card" id="kh-people"></div>
    <div class="flex gap-2 mb-4">
      <button class="btn-secondary flex-1" data-act="ledgerPdf">📄 Ledger PDF</button>
      <button class="btn-secondary flex-1" data-act="agentEdit">🧾 Agent booking</button>
    </div>
    <div id="kh-ledger"></div>
  </main>

  <!-- PHOTOS -->
  <main id="tab-photos" class="tab-content p-4">
    <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">Photos 📷</h2>
      <button class="btn-secondary" style="width:auto;padding:8px 14px" data-act="zipOpen">📦 ZIP</button></div>
    <div id="photos-area"></div>
  </main>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="ab"><span class="emoji">🧭</span><span>Ab</span></button>
    <button class="tab-btn" data-tab="safar"><span class="emoji">🗺️</span><span>Safar</span></button>
    <button class="tab-btn" data-tab="kaghzaat"><span class="emoji">🛂</span><span>Kaghzaat</span></button>
    <button class="tab-btn" data-tab="lists"><span class="emoji">📋</span><span>Lists</span></button>
    <button class="tab-btn" data-tab="kharcha"><span class="emoji">💰</span><span>Kharcha</span></button>
    <button class="tab-btn" data-tab="photos"><span class="emoji">📷</span><span>Photos</span></button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>
<div class="bottom-sheet" id="sheet"><div class="sheet-handle"></div><div id="sheet-body"></div></div>
<div id="celebration-overlay"><canvas id="confetti-canvas"></canvas><div class="big-stamp" id="celeb-stamp"></div><h2 class="text-2xl font-bold mb-2">Stamp mil gaya!</h2><p class="text-lg" id="celeb-name"></p></div>
<div id="toast"></div>
<input type="file" id="file-input" accept="image/*,application/pdf" hidden>

'use strict';
/* ================= DATA ================= */

const CITIES={

};
const TRIP_DAYS=(()=>{const a=[];for(let d=14;d<=29;d++)a.push('2026-11-'+String(d).padStart(2,'0'));return a;})();
const CATS=['Khana','Shopping','Travel','Hotel','Tickets/Tours','Dawai','Others'];
const CAT_BY_TYPE={flight:'Travel',transit:'Travel',transfer:'Travel',arrive:'Travel',hotel:'Hotel',shop:'Shopping',visit:'Tickets/Tours',form:'Others',task:'Others'};
const TYPE_EMO={visit:'📸',shop:'🛍️',hotel:'🏨',transfer:'🚕',form:'📝',task:'✅',transit:'🔁',flight:'✈️',arrive:'🛬'};

function localDate(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayNumber(d){return Math.round((Date.parse(d+'T00:00:00Z')-Date.parse('2026-11-14T00:00:00Z'))/864e5)+1;}
function dayLabel(d){return new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}

function dur(ms){if(ms<=0)return '0m';const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;return (d?d+'d ':'')+(h||d?h+'h ':'')+mm+'m';}
function fmtT(s){const C=CITIES[s.c];return new Date(s.ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:C.zone});}

function locKey(l){return l.country+'|'+l.city+'|'+l.place;}
function pathOf(l){
  if(!l)return ['Misc'];
  if(l.country==='Pakistan')return [l.city,l.place];
  if(l.country===l.city)return [l.country,l.place];
  return [l.country,l.city,l.place];
}

/* ================= STEPS & DOCS ================= */
function allSteps(){
  return ITIN.concat(S.custom).map(x=>Object.assign({},x,{ts:Date.parse(x.dt+':00'+CITIES[x.c].tz)})).sort((a,b)=>a.ts-b.ts);
}
function findStep(id){return allSteps().find(s=>s.id===id);}
function curIndex(steps){let i=steps.findIndex(s=>!S.comp[s.id]&&!S.skip[s.id]);return i<0?steps.length-1:i;}
function docKeys(id){const d=DOC_BY[id];return d&&d.multi?TR().map((_,i)=>id+'_'+i):[id];}
function docDone(k){const x=S.docs[k];return !!x&&(x.status==='done'||x.status==='not_needed');}
function stepMissing(s){
  const docs=[],bp=[];
  if(s.bp)TR().forEach((nm,i)=>{const k='bp_'+s.bp+'_'+i;if(!docDone(k))bp.push({k,who:nm,leg:s.bp});});
  if(s.type!=='flight')s.docs.forEach(id=>{const d=DOC_BY[id];docKeys(id).forEach((k,ix)=>{if(!docDone(k))docs.push({k,id,title:d.title,who:d.multi?TR()[ix]:'',tel:d.type==='tel'});});});
  return {docs,bp};
}
function pendingItems(){
  const out=[];
  DOCS.forEach(d=>docKeys(d.id).forEach((k,i)=>{if(!docDone(k))out.push({k,title:d.title,who:d.multi?TR()[i]:'',multi:!!d.multi,tel:d.type==='tel'});}));
  TICKETS.forEach(tk=>tk.legs.forEach(([lid,label])=>TR().forEach((nm,i)=>{const k='bp_'+lid+'_'+i;if(!docDone(k))out.push({k,title:'Boarding pass · '+label,who:nm,multi:false,bp:true});})));
  return out;
}
function knownPlaces(){
  const m=new Map();
  const add=l=>{const k=locKey(l);if(!m.has(k))m.set(k,{key:k,loc:l,label:pathOf(l).join(' › ')});};
  allSteps().forEach(s=>add(locOf(s)));
  S.extra.forEach(x=>add(x.loc));
  return [...m.values()].sort((a,b)=>a.label.localeCompare(b.label));
}

/* ================= INDEXEDDB ================= */
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('SafarSaathiDB',2);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'});};
    r.onsuccess=()=>{db=r.result;res();};
    r.onerror=()=>rej(r.error);
  });
}
function idbPut(rec){return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function idbGet(id){return new Promise((res,rej)=>{const q=db.transaction('files','readonly').objectStore('files').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
function idbAll(){return new Promise((res,rej)=>{const q=db.transaction('files','readonly').objectStore('files').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
function idbDel(id){return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

/* Object URLs ko track karke revoke karte hain taake memory leak na ho */
let gridUrls=[],sheetUrls=[];
function freeGrid(){gridUrls.forEach(u=>URL.revokeObjectURL(u));gridUrls=[];}

/* ================= IMAGE COMPRESSION ================= */
function compImg(f){
  if(!f.type||!f.type.startsWith('image')||S.settings.photoQ!=='compressed')return Promise.resolve(f);
  return new Promise(res=>{
    const u=URL.createObjectURL(f);const i=new Image();
    i.onload=()=>{
      let w=i.width,h=i.height;const m=2560;
      if(w>m||h>m){if(w>h){h=h*(m/w);w=m;}else{w=w*(m/h);h=m;}}
      const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      c.toBlob(b=>{URL.revokeObjectURL(u);c.width=0;res(b||f);},'image/jpeg',0.88);
    };
    i.onerror=()=>{URL.revokeObjectURL(u);res(f);};
    i.src=u;
  });
}

/* ================= COPY ================= */
function copyText(txt){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();showToast(t('Copy ho gaya!','Copied!'));};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>showToast(t('Copy ho gaya!','Copied!')),fallback);}
  else fallback();
}

function shareOrDownload(file){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:file.name}).catch(()=>{});
    return;
  }
  const u=URL.createObjectURL(file);
  const a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),20000);
}

/* ================= STAMPS (steps + nayi jagahen) ================= */
function cityCode(name){const k=Object.keys(CITIES).find(c=>CITIES[c].name===name);return k||'KHI';}
function stampList(){
  const pp=S.photoPlaces||{};
  const out=allSteps().filter(s=>s.type==='visit').map(s=>{
    const k=locKey(locOf(s));
    return {id:s.id,key:k,c:s.c,place:s.place,emoji:s.emoji,dt:s.dt,got:!!S.comp[s.id]||!!pp[k]};
  });
  const have=new Set(out.map(x=>x.key));
  S.extra.forEach(x=>{
    const k=locKey(x.loc);
    if(have.has(k))return;
    have.add(k);
    out.push({id:'xp_'+k,key:k,c:cityCode(x.loc.city),place:x.loc.place,emoji:'📍',dt:x.date+'T12:00',got:!!pp[k]});
  });
  return out;
}
function collectedSet(){return new Set(stampList().filter(x=>x.got).map(x=>x.id));}
function announceNew(before){
  const fresh=stampList().filter(x=>x.got&&!before.has(x.id));
  if(fresh.length)celebrate(fresh[0]);
}
async function refreshPhotoPlaces(){
  if(!db)return;
  const all=await idbAll();
  const m={};all.forEach(r=>{if(r.kind==='photo'&&r.loc)m[locKey(r.loc)]=1;});
  S.photoPlaces=m;save();
}

    <text font-size="7" font-weight="700" fill="${C.c2}"><textPath href="#b${id}" startOffset="50%" text-anchor="middle">${esc(dayLabel(s.dt.slice(0,10)))}</textPath></text>

function renderSafar(){
  const steps=allSteps();

    const got=!!S.comp[s.id];
    h+=`<div class="tl-item ${got?'done':''}"><div class="tl-em" style="background:${CITIES[s.c].bg}">${s.emoji}</div>
      <div class="flex-1"><div class="text-sm font-bold">${esc(s.title)}</div><div class="text-xs text-muted">${fmtT(s)} · ${esc(s.place)}</div></div>

}

/* ================= ACTIONS: STEPS ================= */
function completeStep(id){
  const s=findStep(id);if(!s)return;
  const m=stepMissing(s);
  if(m.bp.length||m.docs.length){openGate(id);return;}
  finishStep(id);
}
function finishStep(id,forced){
  const s=findStep(id);
  S.comp[id]=Date.now();delete S.skip[id];save();
  renderAll();
  if(s.type==='visit'){celebrate(s);return;}
  openPhotoPrompt(s);
}
function undoStep(id){delete S.comp[id];delete S.skip[id];save();renderAll();}
function skipStep(id){S.skip[id]=true;delete S.comp[id];save();renderAll();}

let gateId=null;
function openGate(id){
  gateId=id;
  const s=findStep(id),m=stepMissing(s);
  let h=`<div class="text-center mb-4"><div class="text-4xl">⚠️</div><h3>${t('Ruko! Yeh baaki hai','Wait! Missing items')}</h3><p class="text-sm text-muted">${esc(s.title)}</p></div>`;
  if(m.bp.length)h+=`<div class="sec-title">🎫 Boarding passes (${m.bp.length} baaki)</div>`+m.bp.map(x=>`<div class="ck"><div class="flex-1"><div class="who">${esc(x.who)}</div><div class="text-xs text-muted">${esc(LEG_LABEL[x.leg]||'')}</div></div><button class="pill" data-act="gUp" data-k="${x.k}" data-title="Boarding pass">Upload</button></div>`).join('');
  if(m.docs.length)h+=`<div class="sec-title">🛂 Documents</div>`+m.docs.map(x=>`<div class="ck"><div class="flex-1"><div class="who">${esc(x.who)}</div><div class="text-sm">${esc(x.title)}</div></div>${x.tel?`<input class="mini-in" id="tel_${x.k}" placeholder="Number"><button class="pill" data-act="telSave" data-k="${x.k}" data-gate="1">Save</button>`:`<button class="pill" data-act="gUp" data-k="${x.k}" data-title="${esc(x.title)}">Upload</button>`}</div>`).join('');
  if(!m.bp.length&&!m.docs.length)h+=`<button class="btn-primary big mt-4" data-act="gGo" data-id="${id}">🎉 ${t('Shabash! Aage chalein','All good! Proceed')}</button>`;
  else if(!m.bp.length)h+=`<button class="btn-secondary big mt-4" data-act="gBypass" data-id="${id}">${t('Skip karke aage chalein','Skip and proceed')}</button>`;
  openSheet(h);
}
function openPhotoPrompt(s){
  openSheet(`<div class="text-center mb-4"><div class="text-4xl">✅</div><h3>${t('Task mukammal!','Task completed!')}</h3><p class="text-sm text-muted">${esc(s.title)}</p></div>

async function buildZip(filter,label){
  openSheet(`<h3>📦 ${t('ZIP ban rahi hai...','Building ZIP...')}</h3><p class="text-sm text-muted">${esc(label)}</p>`);
  const recs=(await idbAll()).filter(r=>(r.kind==='photo'||r.kind==='bill')&&filter(r));
  if(!recs.length){openSheet(`<h3>${t('Kuch nahi mila','Nothing found')}</h3><p class="text-sm text-muted mb-4">${t('Is ke liye koi photo ya bill nahi.','No photo or bill for this.')}</p><button class="btn-secondary" data-act="closeSheet">OK</button>`);return;}
  const z=new JSZip(),cnt={};
  recs.sort((a,b)=>a.ts-b.ts).forEach(r=>{
    const base=r.kind==='bill'?'Bills':'Photos';
    const dir=[base].concat(pathOf(r.loc)).map(safe).join('/');
    cnt[dir]=(cnt[dir]||0)+1;
    const ext=((r.mime||'image/jpeg').split('/')[1]||'jpg').split('+')[0].replace('jpeg','jpg');
    z.file(`${dir}/${r.date}_${pad(cnt[dir])}.${ext}`,r.blob);
  });
  const blob=await z.generateAsync({type:'blob',compression:'STORE'});
  showResult(new File([blob],'Safar_Saathi_'+safe(label)+'.zip',{type:'application/zip'}),recs.length+' files');
}
function ledgerPdf(){
  if(!window.jspdf||!window.jspdf.jsPDF){showToast(t('PDF library load nahi hui. Internet check karein.','PDF library failed to load. Check internet.'));return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  if(typeof doc.autoTable!=='function'){showToast(t('Table plugin load nahi hua.','Table plugin failed to load.'));return;}
  doc.setFontSize(14);doc.text('Safar Saathi - Kharcha Ledger (14-29 Nov 2026)',40,40);
  doc.setFontSize(9);doc.text('Bills is PDF mein shamil nahi. PKR conversion hardcoded rates par.',40,56);
  const exps=S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  const rows=[],subs=[];let cur='',dayTot=0;
  const flush=()=>{if(cur){rows.push(['','','','',"Din ka total",'',Math.round(dayTot).toString(),'']);subs.push(rows.length-1);}};
  exps.forEach(e=>{
    if(e.date!==cur){flush();cur=e.date;dayTot=0;}
    dayTot+=e.pkr;
    rows.push([e.date,pathOf(e.loc).join(' > '),e.cat,e.who,e.title,e.amt+' '+e.curr,Math.round(e.pkr).toString(),e.method]);
  });
  flush();
  const expTot=exps.reduce((a,e)=>a+e.pkr,0),agent=S.agentPKR||0;
  rows.push(['','','','','Kharcha total (PKR)','',Math.round(expTot).toString(),'']);subs.push(rows.length-1);
  rows.push(['','','','','Agent booking (PKR)','',Math.round(agent).toString(),'']);
  rows.push(['','','','','GRAND TOTAL (PKR)','',Math.round(expTot+agent).toString(),'']);subs.push(rows.length-1);
  doc.autoTable({
    startY:70,
    head:[['Date','Location','Category','Kis ke liye','Kya kharcha','Amount','PKR','Payment']],
    body:rows,
    styles:{fontSize:8,cellPadding:4},
    headStyles:{fillColor:[37,99,235]},
    didParseCell:d=>{if(d.section==='body'&&subs.includes(d.row.index))d.cell.styles.fontStyle='bold';}
  });
  const blob=doc.output('blob');
  showResult(new File([blob],'Safar_Saathi_Ledger.pdf',{type:'application/pdf'}),'PDF ready');
}

/* ================= WEATHER ================= */
const WX={};
async function updateWeather(){
  const steps=allSteps(),cur=steps[curIndex(steps)];
  const C=CITIES[cur.c];
  const cached=WX[cur.c];
  if(!cached||Date.now()-cached.ts>9e5){
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${C.lat}&longitude=${C.lng}&hourly=temperature_2m,weathercode&timezone=auto&forecast_days=2`);
      const j=await r.json();
      WX[cur.c]={ts:Date.now(),hours:j.hourly.time.map((x,i)=>({t:x,temp:Math.round(j.hourly.temperature_2m[i]),code:j.hourly.weathercode[i]}))};
    }catch(e){WX[cur.c]={ts:Date.now(),hours:null};}
  }
  const w=WX[cur.c];
  let temp='--';
  if(w&&w.hours){
    const nowKey=new Intl.DateTimeFormat('en-CA',{timeZone:C.zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).format(new Date(now())).replace(', ','T')+':00';
    const hit=w.hours.find(h=>h.t.slice(0,13)===nowKey.slice(0,13));
    if(hit)temp=hit.temp;
  }
  $('wbtn').textContent=temp+'°';
  return w;
}
function wIcon(c){if(c<=1)return '☀️';if(c<=3)return '⛅';if(c<=49)return '☁️';if(c<=69)return '🌧️';if(c<=79)return '❄️';return '⛈️';}
async function openWeather(){
  const steps=allSteps(),cur=steps[curIndex(steps)];
  openSheet(`<h3>${CITIES[cur.c].name} · ${t('Mausam','Weather')}</h3><div id="wlist" class="text-muted text-sm">Loading...</div>`);
  const w=await updateWeather();
  if(!w||!w.hours){$('wlist').textContent=t('Mausam nahi mil saka (internet?)','Weather unavailable (internet?)');return;}
  const list=w.hours.filter(h=>Date.parse(h.t+':00')>Date.now()-3600000).slice(0,24);
  $('wlist').innerHTML=`<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px">${list.map(h=>`<div class="card" style="min-width:70px;text-align:center;margin:0"><div class="text-xs text-muted font-bold">${h.t.slice(11,16)}</div><div style="font-size:1.3rem">${wIcon(h.code)}</div><div class="font-bold">${h.temp}°</div></div>`).join('')}</div>`;
}

function switchTab(n){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  $('tab-'+n).classList.add('active');
  const b=document.querySelector(`.tab-btn[data-tab="${n}"]`);if(b)b.classList.add('active');
  window.scrollTo(0,0);
  if(n==='photos')renderPhotos();
}
function viewPhoto(id){
  openSheet(`<div id="pv"></div><button class="btn-secondary big mt-4" data-act="photoDelAsk" data-id="${id}">🗑️ ${t('Delete','Delete')}</button><button class="btn-secondary big mt-2" data-act="closeSheet">${t('Band karein','Close')}</button>`);

}

});
